# Main Page Setup

title: 박선우의 포트폴리오 # This is what shows up in the tab of the browser



# Hero Section
name: 박선우
headline: 글래스고 대학교 학/석사 졸업 | 기계공학 엔지니어
description: >- # dont remove this line. this will ignore all new lines until the next section
  설계부터 해석, 제작, 실험 검증까지 전 과정을 직접 경험하며 문제를 끝까지 해결해온 기계공학 엔지니어입니다. 구조해석, 진동, 열유체, 로봇 연구 등 다양한 프로젝트를 통해 이론을 실제 결과로 연결하는 역량을 쌓았으며, 서로 다른 조건과 데이터에서 핵심 원인을 찾아 설계 개선으로 이어가는 데 강점이 있습니다. 새로운 기술을 빠르게 습득하고, 부분보다 시스템 전체를 보며 가장 적절한 해결 방법을 선택하는 엔지니어를 지향합니다.


